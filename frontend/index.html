<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ARGUS — Autonomous AI Reliability & Recovery Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function() {
        // 1. Defensively wrap setTimeout to absorb the external web-vitals timer exception (at et.reportAllChanges at n.timeout)
        var origSetTimeout = window.setTimeout;
        window.setTimeout = function(fn, delay) {
          var args = Array.prototype.slice.call(arguments, 2);
          if (typeof fn === 'function') {
            var safeFn = function() {
              try {
                return fn.apply(this, args);
              } catch (err) {
                var errStr = String((err && (err.message || err)) || '');
                var stackStr = String((err && err.stack) || '');
                if (errStr.indexOf("reading 'startTime'") !== -1 || stackStr.indexOf('reportAllChanges') !== -1) {
                  return; // Silently absorb known external web-vitals attribution bug at the timer boundary
                }
                throw err;
              }
            };
            return origSetTimeout.call(this, safeFn, delay);
          }
          return origSetTimeout.apply(this, arguments);
        };

        // 2. Global window.onerror fallback
        var prevOnError = window.onerror;
        window.onerror = function(msg, url, line, col, err) {
          var errorStr = String(msg || '');
          var stackStr = (err && err.stack) ? String(err.stack) : '';
          if (
            errorStr.indexOf("reading 'startTime'") !== -1 ||
            stackStr.indexOf('reportAllChanges') !== -1 ||
            stackStr.indexOf('startTime') !== -1
          ) {
            return true; // Prevents default browser console error logging
          }
          if (typeof prevOnError === 'function') {
            return prevOnError.apply(this, arguments);
          }
          return false;
        };
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
